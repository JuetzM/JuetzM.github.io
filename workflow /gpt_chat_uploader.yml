name: GPT Chat & File Upload

on:
  workflow_dispatch:  # Manuell startbar oder erweiterbar für andere Trigger

jobs:
  gpt_chat:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'

      - name: Install Dependencies
        run: pip install openai

      - name: Generate GPT Response
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python .github/scripts/gpt_chat.py

      - name: Commit & Push Response File
        run: |
          git config --global user.name "GitHub Actions Bot"
          git config --global user.email "actions@github.com"
          git add gpt_response.txt
          git commit -m "Automated GPT Response Update"
          git push
